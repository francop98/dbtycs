<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análisis de Sangre - DBTYCS</title>
<link rel="stylesheet" href="../styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
</head>
<body>
<div class="container">
  <header style="display: flex; justify-content: space-between; align-items: flex-start;">
    <div>
      <h1>🩸 Análisis de Sangre</h1>
      <p>Cargá tus resultados de laboratorio y mirá cómo evolucionan en el tiempo.</p>
    </div>
    <button onclick="window.location.href='../index.html'" class="btn btn-secondary" style="white-space: nowrap;">← Panel</button>
  </header>

  <main>
    <!-- Formulario nuevo análisis -->
    <div class="form-card">
      <div class="section-title" style="margin-top: 0;">Nuevo análisis</div>

      <form id="formNuevoAnalisis">
        <div class="form-group" style="max-width: 260px;">
          <label for="inputFechaAnalisis">Fecha del análisis</label>
          <input type="date" id="inputFechaAnalisis" required>
        </div>

        <div id="camposAnalisis"></div>

        <div class="form-group" style="margin: 16px 0;">
          <label for="inputNotasAnalisis">Notas (opcional)</label>
          <textarea id="inputNotasAnalisis" rows="2" placeholder="Ej. laboratorio, ayuno de 10hs, etc."></textarea>
        </div>

        <p style="font-size: 0.78rem; color: var(--text-muted); margin-bottom: 14px;">
          Todos los campos son opcionales — completá solo los que tengas en ese análisis.
        </p>

        <button type="submit" class="btn" style="width: 100%;">Guardar Análisis</button>
      </form>
    </div>

    <!-- Tabla histórica -->
    <div class="section-title">Historial</div>
    <div id="tablaAnalisis" style="overflow-x: auto;"></div>

    <!-- Gráficos de evolución -->
    <div class="section-title">Evolución por parámetro</div>
    <div id="graficosAnalisis"></div>
  </main>
</div>

<script type="module" src="../js/analisis.js"></script>
</body>
</html>
