<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Insulina - DBTYCS</title>
<link rel="stylesheet" href="../styles.css">
</head>
<body>
<div class="container">
  <header style="display: flex; justify-content: space-between; align-items: flex-start;">
    <div>
      <h1>🧾 Registro de Insulina</h1>
      <p>Cargá cada aplicación de basal y rápida. Podés cargar varias por día.</p>
    </div>
    <div style="display: flex; gap: 8px;">
      <button onclick="window.location.href='insulinaactiva.html'" class="btn btn-secondary" style="white-space: nowrap;">⚡ Activa</button>
      <button onclick="window.location.href='../index.html'" class="btn btn-secondary" style="white-space: nowrap;">← Panel</button>
    </div>
  </header>

  <main>

  <main>
    <!-- Formulario nueva aplicación -->
    <div class="form-card">
      <div class="section-title" style="margin-top: 0;">Nueva aplicación</div>

      <form id="formNuevaInsulina">
        <div class="form-grid">
          <div class="form-group">
            <label for="selectTipoInsulina">Tipo</label>
            <select id="selectTipoInsulina">
              <option value="rapida" selected>Rápida</option>
              <option value="basal">Basal</option>
            </select>
          </div>

          <div class="form-group">
            <label for="inputUnidadesInsulina">Unidades (U)</label>
            <input type="number" id="inputUnidadesInsulina" min="0" step="0.5" placeholder="Ej. 8" required>
          </div>

          <div class="form-group">
            <label for="inputFechaHoraInsulina">Fecha y hora</label>
            <input type="datetime-local" id="inputFechaHoraInsulina" required>
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 16px;">
          <label for="inputNotasInsulina">Notas (opcional)</label>
          <input type="text" id="inputNotasInsulina" placeholder="Ej. corrección, antes de dormir, etc.">
        </div>

        <button type="submit" class="btn" style="width: 100%;">Guardar Aplicación</button>
      </form>
    </div>

    <!-- Historial por día -->
    <div class="section-title">Historial por día</div>
    <div id="listaHistorialInsulina"></div>
  </main>
</div>

<script type="module" src="../js/insulina.js"></script>
</body>
</html>
